<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#06101b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Battle PvP">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Battle_PvP</title>
  <link rel="stylesheet" href="shell.css">
  <link rel="manifest" href="manifest.webmanifest">
</head>
<body>
  <main id="unity-container">
    <div id="game-stage">
      <canvas id="unity-canvas" width="960" height="600" tabindex="0" aria-label="Battle PvP 게임"></canvas>
      <div id="loading"><strong>BATTLE <em>PVP</em></strong><span id="load-label">게임을 불러오는 중</span><progress id="load-progress" max="1" value="0"></progress></div>
      <div id="game-message" role="status" hidden></div>
      <section id="mobile-display-help" hidden aria-label="전체화면 안내">
        <p id="mobile-display-instructions"></p>
        <button id="close-display-help" type="button">이대로 플레이</button>
      </section>
    </div>
    <footer>
      <span id="display-hint">Esc 커서 전환</span>
      <div class="controls"><button id="performance-button" type="button" aria-expanded="false">성능 정보</button><button id="fullscreen-button" type="button">전체화면</button></div>
      <section id="performance-info" hidden aria-label="성능 정보"><span id="renderer-info">렌더러 확인 중</span><span id="frame-info">FPS 확인 중</span><small>화질은 기기 성능에 맞춰 자동 조절됩니다. 게임 설정에서 최대 화질을 선택할 수 있습니다.</small></section>
    </footer>
  </main>
  <script src="shell.js"></script>
  <script src="split-data.js"></script>
  <script>
    const shell = window.__battlePvpWebShell = BattlePvpWebShell.create(document, window, navigator);
    const loader = document.createElement('script');
    loader.src = 'Build/aaf218a4109d5b145c361641666ef71e.loader.js';
    loader.onload = async () => {
      let dataUrl;
      try {
        dataUrl = await BattlePvpData.download([{"url": "Build/efe9eeac2fd2f2a209d86e964710d8fe.data.unityweb.part1", "bytes": 62914560}, {"url": "Build/efe9eeac2fd2f2a209d86e964710d8fe.data.unityweb.part2", "bytes": 51523970}], progress => {
          document.getElementById('load-progress').value = progress * 0.7;
        });
        const instance = await createUnityInstance(document.getElementById('unity-canvas'), {
      dataUrl,
      frameworkUrl: 'Build/5a9985e6a06143614781cc13cacfe4e7.framework.js.unityweb',
      codeUrl: 'Build/8f1742439132b0fbe5e80721099e8463.wasm.unityweb',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Junu', productName: 'Battle_PvP', productVersion: '0.1.0',
      // Render UI at CSS resolution instead of multiplying every pixel on high-DPI displays.
      devicePixelRatio: 1,
      matchWebGLToCanvasSize: true,
      webglContextAttributes: { preserveDrawingBuffer: false, powerPreference: 2 },
      showBanner: (message, type) => { if (type === 'error') shell.showMessage(message); }
        }, progress => { document.getElementById('load-progress').value = 0.7 + progress * 0.3; });
        shell.attach(instance);
      } catch (error) {
        shell.showMessage(String(error));
      } finally {
        if (dataUrl) URL.revokeObjectURL(dataUrl);
      }
    };
    loader.onerror = () => shell.showMessage('게임 파일을 불러오지 못했습니다. 새로고침해 주세요.');
    document.body.appendChild(loader);
  </script>
</body>
</html>
